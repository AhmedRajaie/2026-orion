<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGX Trading Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            padding: 30px;
        }

        h1 {
            margin-bottom: 25px;
            color: white;
            font-size: 34px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 20px;
        }

        .status {
            background: #1e293b;
            padding: 18px 25px;
            border-radius: 12px;
            width: 250px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0,0,0,.35);
        }

        .selector {
            background: #1e293b;
            padding: 18px 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,.35);
        }

        .selector label {
            margin-right: 10px;
            font-size: 17px;
        }

        select {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        .cards {

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 20px;

            margin-bottom: 25px;

        }

        .card {

            background: #1e293b;

            border-radius: 14px;

            padding: 25px;

            text-align: center;

            box-shadow: 0 10px 25px rgba(0,0,0,.35);

        }

        .card h3 {

            color: #94a3b8;

            margin-bottom: 12px;

            font-size: 17px;

            font-weight: normal;

        }

        .card h2 {

            color: #38bdf8;

            font-size: 30px;

        }

        .chart-panel {

            background: #1e293b;

            border-radius: 14px;

            padding: 20px;

            box-shadow: 0 10px 25px rgba(0,0,0,.35);

        }

        canvas {

            width: 100% !important;

            height: 600px !important;

        }

        @media(max-width:1000px){

            .cards{

                grid-template-columns: repeat(2,1fr);

            }

            .top-bar{

                flex-direction: column;

                align-items: stretch;

            }

        }

        @media(max-width:600px){

            .cards{

                grid-template-columns:1fr;

            }

        }

    </style>

</head>

<body>

    <h1>📈 EGX Trading Dashboard</h1>

    <div class="top-bar">

        <div id="status" class="status">
            Connecting...
        </div>

        <div class="selector">

            <label>Select Stock</label>

            <select id="symbolSelect"></select>

        </div>

    </div>

    <div class="cards">

        <div class="card">

            <h3>Last Price</h3>

            <h2 id="lastPrice">--</h2>

        </div>

        <div class="card">

            <h3>Highest Price</h3>

            <h2 id="highPrice">--</h2>

        </div>

        <div class="card">

            <h3>Lowest Price</h3>

            <h2 id="lowPrice">--</h2>

        </div>

        <div class="card">

            <h3>Average Volume</h3>

            <h2 id="avgVolume">--</h2>

        </div>

        <div class="card">
           <div class="title">Portfolio Value</div>
           <div id="portfolioValue" class="value">--</div>
        </div>

        <div class="card">
           <div class="title">Max Drawdown</div>
           <div id="drawdown" class="value">--</div>
        </div>

        <div class="card">
           <div class="title">Buy Operations</div>
           <div id="buyCount" class="value">--</div>
        </div>

        <div class="card">
           <div class="title">Sell Operations</div>
           <div id="sellCount" class="value">--</div>
        </div>

    </div>

    <div class="chart-panel">

        <canvas id="priceChart"></canvas>

    </div>

    <div class="panel">

        <h2>Portfolio Equity Curve</h2>

        <canvas id="equityChart"></canvas>

    </div>

    <script src="app.js"></script>

</body>

</html>
