<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Trading Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background:#0b1220; color:#e6edf3; }
    .panel { background:#111a2b; border-radius:14px; padding:18px; margin-bottom:20px; box-shadow:0 18px 50px rgba(0,0,0,0.16); }
    h1 { font-weight:700; margin-bottom:14px; }
    h2 { font-size:1.1rem; margin-bottom:12px; color:#dbeafe; }
    .dashboard-grid { display:grid; gap:20px; grid-template-columns:1fr; }
    .controls { display:flex; flex-wrap:wrap; align-items:flex-start; gap:12px; margin-bottom:16px; }
    .symbol-list { display:flex; flex-wrap:wrap; gap:8px; max-width:560px; }
    .symbol-chip { display:inline-flex; align-items:center; justify-content:center; padding:8px 12px; border-radius:999px; border:1px solid #2d3a52; background:#0b1220; color:#e6edf3; cursor:pointer; user-select:none; font-size:0.95rem; }
    .symbol-chip.selected { background:#2563eb; border-color:#2563eb; color:#fff; }
    .controls label { display:block; margin-bottom:8px; color:#9fb3c8; font-size:0.95rem; }
    .controls input { width:100%; box-sizing:border-box; }
    .controls button { min-width:140px; }
    .stats-grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); margin-bottom:16px; }
    .stat-box { background:#0b1220; border:1px solid #2d3a52; border-radius:10px; padding:14px 16px; }
    .stat-box .label { font-size:12px; color:#9fb3c8; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px; display:block; }
    .stat-box .value { font-size:18px; font-weight:700; line-height:1.3; }
    .metric-row { display:flex; flex-wrap:wrap; gap:14px; margin-top:8px; }
    .metric-card { flex:1 1 220px; background:#0c1424; border:1px solid #23305a; border-radius:12px; padding:14px; }
    .metric-card .label { font-size:12px; color:#94a3b8; margin-bottom:8px; }
    .metric-card .value { font-size:20px; font-weight:700; }
    @media (min-width: 980px) {
      .dashboard-grid { grid-template-columns: 1.3fr 0.9fr; }
      .panel-full { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <h1>Trading Dashboard</h1>
  <div class="panel" id="status">connecting…</div>
  <div class="panel controls-panel">
    <div class="controls">
      <div style="min-width:260px;">
        <label>اختر الأسهم</label>
        <div id="symbolList" class="symbol-list"></div>
      </div>
      <div>
        <label for="commissionInput">عمولة (%)</label>
        <input id="commissionInput" type="number" min="0" step="0.01" value="0" style="padding:10px 12px; border-radius:8px; border:1px solid #2d3a52; background:#0b1220; color:#e6edf3;" />
      </div>
      <div style="align-self:flex-end;">
        <button id="updateButton" style="padding:10px 16px; border:none; border-radius:8px; background:#2563eb; color:#fff; font-weight:700; cursor:pointer;">تحديث العرض</button>
      </div>
    </div>
    <div class="metric-row" id="summaryCards"></div>
  </div>
  <div class="dashboard-grid">
    <div class="panel">
      <h2>محفظة الأسهم</h2>
      <canvas id="equityChart"></canvas>
      <div id="backtestStats" class="stats-grid" style="margin-top:18px;"></div>
    </div>
    <div class="panel panel-full">
      <h2>Strategy Metrics</h2>
      <div id="metricsGrid" class="stats-grid"></div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
