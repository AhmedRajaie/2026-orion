<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Trading Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 24px;
      background: #0b1220;
      color: #e6edf3;
    }

    .panel {
      background: #111a2b;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }

    h1 {
      font-weight: 600;
    }

    canvas {
      width: 100%;
      height: 420px;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-top: 16px;
      margin-bottom: 20px;
    }

    .kpi {
      background: #0f172a;
      border: 1px solid #22324c;
      border-radius: 8px;
      padding: 14px;
      transition: 0.2s;
    }

    .kpi:hover {
      border-color: #3b82f6;
    }

    .kpi-title {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .kpi-value {
      font-size: 22px;
      font-weight: 700;
      margin-top: 8px;
    }
  </style>

</head>

<body>

  <h1>Trading Dashboard</h1>

  <div class="panel" id="status">
    connecting...
  </div>

  <div class="panel">

    <label for="symbolSelect"><strong>Symbol:</strong></label>
    <select id="symbolSelect"></select>

    <div class="kpis">

      <div class="kpi">
        <div class="kpi-title">Latest Close</div>
        <div class="kpi-value" id="kpiLatest"></div>
      </div>

      <div class="kpi">
        <div class="kpi-title">Daily Change</div>
        <div class="kpi-value" id="kpiDaily"></div>
      </div>

      <div class="kpi">
        <div class="kpi-title">Total Return</div>
        <div class="kpi-value" id="kpiReturn"></div>
      </div>

      <div class="kpi">
        <div class="kpi-title">Max Drawdown</div>
        <div class="kpi-value" id="kpiDrawdown"></div>
      </div>

      <div class="kpi">
        <div class="kpi-title">SMA (9)</div>
        <div class="kpi-value" id="kpiSma9"></div>
      </div>

      <div class="kpi">
        <div class="kpi-title">SMA (20)</div>
        <div class="kpi-value" id="kpiSma20"></div>
      </div>

      <div class="kpi">
        <div class="kpi-title">Trend</div>
        <div class="kpi-value" id="kpiTrend"></div>
      </div>

      <div class="kpi">
        <div class="kpi-title">Signal</div>
        <div class="kpi-value" id="kpiSignal"></div>
      </div>

    </div>

    <canvas id="priceChart"></canvas>

  </div>

  <script src="app.js"></script>

</body>

</html>
