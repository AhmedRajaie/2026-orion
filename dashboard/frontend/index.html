<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Trading Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 24px 32px;
      background: #0b1220;
      color: #e6edf3;
    }
    h1 { font-weight: 600; margin-bottom: 4px; }
    .subtitle { color: #8b98a9; margin-bottom: 24px; font-size: 14px; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    select {
      background: #111a2b;
      color: #e6edf3;
      border: 1px solid #223049;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
    }

    .panel {
      background: #111a2b;
      border: 1px solid #1b2740;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .panel h2 {
      margin: 0 0 12px 0;
      font-size: 15px;
      font-weight: 600;
      color: #c7d1e0;
    }

    #status.ok { color: #4ade80; }
    #status.bad { color: #f87171; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #111a2b;
      border: 1px solid #1b2740;
      border-radius: 12px;
      padding: 16px;
    }
    .stat-card .label { font-size: 12px; color: #8b98a9; margin-bottom: 6px; }
    .stat-card .value { font-size: 22px; font-weight: 600; }
    .value.positive { color: #4ade80; }
    .value.negative { color: #f87171; }

    canvas { max-height: 360px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #1b2740; }
    th { color: #8b98a9; font-weight: 500; }
    .buy { color: #4ade80; }
    .sell { color: #f87171; }
  </style>
</head>
<body>
  <h1>Trading Dashboard</h1>
  <div class="subtitle">MA9 / MA20 crossover strategy backtest</div>

  <div class="toolbar">
  <div class="panel" id="status" style="margin:0; padding:10px 16px;">connecting…</div>
  <select id="symbolSelect"></select>
  <label style="font-size:13px; color:#8b98a9;">Fast MA
    <input type="number" id="fastInput" value="9" min="1" max="200" style="width:60px; margin-left:6px; background:#111a2b; color:#e6edf3; border:1px solid #223049; border-radius:6px; padding:6px;">
  </label>
  <label style="font-size:13px; color:#8b98a9;">Slow MA
    <input type="number" id="slowInput" value="20" min="2" max="400" style="width:60px; margin-left:6px; background:#111a2b; color:#e6edf3; border:1px solid #223049; border-radius:6px; padding:6px;">
  </label>
  <button id="applyBtn" style="background:#38bdf8; color:#0b1220; border:none; border-radius:8px; padding:8px 16px; font-weight:600; cursor:pointer;">Apply</button>
</div>

  <div class="stats-grid" id="statsGrid"></div>

  <div class="panel">
    <h2>Price with MA9 / MA20 and signals</h2>
    <canvas id="priceChart"></canvas>
  </div>

  <div class="panel">
    <h2>Portfolio value over time</h2>
    <canvas id="equityChart"></canvas>
  </div>

  <div class="panel">
    <h2>Trade log</h2>
    <table id="tradeLog">
      <thead><tr><th>Type</th><th>Date</th><th>Price</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
